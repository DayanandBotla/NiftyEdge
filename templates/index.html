<html lang="en">

<body>

<div id="loader">
  <div style="width:46px;height:46px;border-radius:13px;background:linear-gradient(135deg,#00d4aa,#a78bfa);
    display:flex;align-items:center;justify-content:center;font-size:22px">⚡</div>
  <div style="color:#fff;font-size:17px;font-weight:700;letter-spacing:2px;font-family:'Syne',sans-serif">GAMMA BLAST TERMINAL</div>
  <div style="color:#444;font-size:10px;letter-spacing:1.5px">INITIALISING SIGNAL ENGINE...</div>
  <div style="width:180px;height:2px;background:#1e1e1e;border-radius:1px;overflow:hidden">
    <div style="height:100%;background:linear-gradient(90deg,#00d4aa,#a78bfa);animation:loadbar 1.4s ease-in-out infinite"></div>
  </div>
</div>

<div id="root"></div>

<script type="text/babel" data-presets="react">
/* global React, ReactDOM */
const { useState, useEffect, useRef, useCallback } = React;

// ══════════════════════════════════════════════════════
// IST UTILS — Railway runs UTC, always use UTC+5:30
// ══════════════════════════════════════════════════════
const IST_MS     = 5.5 * 60 * 60 * 1000;
const nowIST     = () => new Date(Date.now() + IST_MS);
const istTimeStr = () => {
  const d = nowIST();
  return String(d.getUTCHours()).padStart(2,"0") + ":" +
         String(d.getUTCMinutes()).padStart(2,"0") + ":" +
         String(d.getUTCSeconds()).padStart(2,"0");
};
const istHHMM    = () => istTimeStr().slice(0,5);
const istDateStr = () => nowIST().toLocaleDateString("en-IN",
  {timeZone:"UTC",weekday:"short",day:"2-digit",month:"short"}).toUpperCase();
const istDecHour = () => { const d=nowIST(); return d.getUTCHours()+d.getUTCMinutes()/60; };

// Nifty=Tue(2), BankNifty=Wed(3), Sensex=Fri(5)
const EXPIRY_DOW  = {NIFTY:2, BANKNIFTY:3, SENSEX:5};
const isExpiryDay = (code) => nowIST().getUTCDay() === (EXPIRY_DOW[code] || 2);

const getSession = () => {
  const h = istDecHour();
  if (h < 9.0)  return {label:"Pre-Market",  color:"#444"   };
  if (h < 9.25) return {label:"Pre-Open",    color:"#f59e0b"};
  if (h < 15.5) return {label:"Market Open", color:"#00d4aa"};
  if (h < 16.0) return {label:"Post-Close",  color:"#a78bfa"};
  return               {label:"Closed",      color:"#444"   };
};
const isBlastWin = () => {
  const h = istDecHour();
  return (h >= 9.33 && h <= 10.5) || (h >= 14.0 && h <= 15.25);
};

// ══════════════════════════════════════════════════════
// HELPERS
// ══════════════════════════════════════════════════════
const INDICES = {
  NIFTY:     {code:"NIFTY",     name:"NIFTY 50",   color:"#00d4aa", fallback:22447, step:50,  exp:"TUE"},
  BANKNIFTY: {code:"BANKNIFTY", name:"BANK NIFTY", color:"#f59e0b", fallback:48230, step:100, exp:"WED"},
  SENSEX:    {code:"SENSEX",    name:"SENSEX",     color:"#a78bfa", fallback:73820, step:100, exp:"FRI"},
};
const fmt    = n => Number(n||0).toLocaleString("en-IN");
const fmtPct = n => (n>=0?"+":"")+Number(n||0).toFixed(2)+"%";
const getATM = (spot,step) => Math.round(spot/step)*step;

// ══════════════════════════════════════════════════════
// SIGNAL ENGINE
// S1=Decay Pause(expiry only) S2=PCR S3=OI S4=VWAP
// ══════════════════════════════════════════════════════
function computeSignals(chain, pcr, prevPcr, spot, step, vwap, onExpiry, prevChain) {
  const atm   = getATM(spot,step);
  const otmCE = chain.find(s => s.strike === atm+step);
  const otmPE = chain.find(s => s.strike === atm-step);
  const pCE   = (prevChain||[]).find(s => s.strike === atm+step);
  const pPE   = (prevChain||[]).find(s => s.strike === atm-step);
  const dPCR  = pcr - prevPcr;

  // S1
  let ceFlat=false, peFlat=false;
  if (onExpiry && otmCE && pCE && pCE.ce.ltp > 0) ceFlat = otmCE.ce.ltp >= pCE.ce.ltp * 0.98;
  if (onExpiry && otmPE && pPE && pPE.pe.ltp > 0) peFlat = otmPE.pe.ltp >= pPE.pe.ltp * 0.98;

  // S2
  const pcrBull = pcr < 0.9 || dPCR < -0.12;
  const pcrBear = pcr > 1.2 || dPCR >  0.12;

  // S3
  const ceOIPct = (otmCE && otmCE.ce.oi>0) ? (otmCE.ce.oiChange/otmCE.ce.oi)*100 : 0;
  const peOIPct = (otmPE && otmPE.pe.oi>0) ? (otmPE.pe.oiChange/otmPE.pe.oi)*100 : 0;
  const oiBull  = ceOIPct > 15;
  const oiBear  = peOIPct < -15;

  // S4
  const aboveVWAP = spot > vwap;
  const belowVWAP = spot < vwap;

  const bull = [ceFlat||(!onExpiry&&aboveVWAP), pcrBull, oiBull, aboveVWAP].filter(Boolean).length;
  const bear = [peFlat||(!onExpiry&&belowVWAP), pcrBear, oiBear, belowVWAP].filter(Boolean).length;
  const dir  = bull>=3?"BULL":bear>=3?"BEAR":"NEUTRAL";

  return {
    signals:[
      {id:"S1",label:"Premium Decay Pause",
       note:onExpiry?"Expiry active":"Non-expiry — skipped",
       bull:ceFlat, bear:peFlat,
       val:!onExpiry?"N/A (non-expiry)":ceFlat?"CE FLAT ⚠":peFlat?"PE FLAT ⚠":"Decaying ✓"},
      {id:"S2",label:"PCR Velocity",
       bull:pcrBull, bear:pcrBear,
       val:`${pcr.toFixed(2)} (Δ${dPCR>=0?"+":""}${dPCR.toFixed(2)})`},
      {id:"S3",label:"OI Velocity",
       bull:oiBull, bear:oiBear,
       val:`CE:${ceOIPct.toFixed(0)}%  PE:${peOIPct.toFixed(0)}%`},
      {id:"S4",label:"Price vs VWAP",
       bull:aboveVWAP, bear:belowVWAP,
       val:`${spot>vwap?"Above":"Below"} VWAP (${fmt(Math.round(vwap))})`},
    ],
    dir, confidence:Math.max(bull,bear), bull, bear,
    blastStrike: dir==="BULL"?(otmCE?otmCE.strike:0):dir==="BEAR"?(otmPE?otmPE.strike:0):0,
    blastSide:   dir==="BULL"?"CE":dir==="BEAR"?"PE":"--",
  };
}

// ══════════════════════════════════════════════════════
// DATA HOOKS
// ══════════════════════════════════════════════════════
function useBackend(url) {
  const [live,setLive] = useState(null);
  const [ok,  setOk]   = useState(false);
  const [err, setErr]  = useState("");
  useEffect(()=>{
    if(!url){setOk(false);return;}
    let dead=false;
    const poll=async()=>{
      try{
        const r=await fetch(url+"/api/livedata",{cache:"no-store"});
        if(!r.ok) throw new Error("HTTP "+r.status);
        const d=await r.json();
        if(!dead){setLive(d);setOk(true);setErr("");}
      }catch(e){if(!dead){setOk(false);setErr(e.message);}}
    };
    poll();
    const id=setInterval(poll,2000);
    return ()=>{dead=true;clearInterval(id);};
  },[url]);
  return {live,ok,err};
}

function useChain(url,symbol,ok) {
  const [chain, setChain] = useState([]);
  const [pcr,   setPcr]   = useState(1.0);
  const [prev,  setPrev]  = useState({chain:[],pcr:1.0});
  const [vwap,  setVwap]  = useState(0);
  useEffect(()=>{
    if(!url||!ok) return;
    let dead=false;
    const fc=async()=>{
      try{
        const r=await fetch(url+"/api/optionchain/"+symbol,{cache:"no-store"});
        const d=await r.json();
        if(!dead && d.chain && d.chain.length){
          setPrev(p=>({chain:p.chain.length?p.chain:d.chain,pcr:p.pcr}));
          setChain(d.chain); setPcr(d.pcr||1.0);
        }
      }catch(e){}
    };
    const fv=async()=>{
      try{
        const r=await fetch(url+"/api/vwap/"+symbol,{cache:"no-store"});
        const d=await r.json();
        if(!dead && d.vwap>0) setVwap(d.vwap);
      }catch(e){}
    };
    fc();fv();
    const ci=setInterval(fc,15000);
    const vi=setInterval(fv,30000);
    return ()=>{dead=true;clearInterval(ci);clearInterval(vi);};
  },[url,symbol,ok]);
  return {chain,pcr,prevChain:prev.chain,prevPcr:prev.pcr,vwap};
}

// ══════════════════════════════════════════════════════
// PURE SVG CHARTS  (no Recharts dependency)
// ══════════════════════════════════════════════════════
function OIBarChart({chain,spot,step,color}) {
  if(!chain.length) return (
    <div style={{height:120,display:"flex",alignItems:"center",justifyContent:"center",color:"#333",fontSize:11}}>
      No OI data
    </div>
  );
  const W=340, H=100, PAD=4;
  const atm = getATM(spot,step);
  const maxOI = Math.max(...chain.map(s=>Math.max(s.ce.oi,s.pe.oi)),1);
  const bw = Math.floor((W - PAD*2) / (chain.length*2+1));
  return (
    <svg viewBox={`0 0 ${W} ${H+20}`} style={{width:"100%",overflow:"visible"}}>
      {chain.map((s,i)=>{
        const x = PAD + i*(bw*2+2);
        const ceH = Math.max(2, (s.ce.oi/maxOI)*(H-10));
        const peH = Math.max(2, (s.pe.oi/maxOI)*(H-10));
        const isATM = s.strike===atm;
        return (
          <g key={s.strike}>
            <rect x={x} y={H-ceH} width={bw} height={ceH} fill={isATM?"#f87171":"#f8717188"} rx={1}/>
            <rect x={x+bw+1} y={H-peH} width={bw} height={peH} fill={isATM?"#34d399":"#34d39988"} rx={1}/>
            <text x={x+bw} y={H+14} textAnchor="middle" fill={isATM?color:"#444"} fontSize="8" fontFamily="monospace">
              {s.strike}
            </text>
            {isATM && <line x1={x+bw} y1={0} x2={x+bw} y2={H} stroke={color} strokeWidth={1} strokeDasharray="3,2" opacity={0.5}/>}
          </g>
        );
      })}
      <line x1={PAD} y1={H} x2={W-PAD} y2={H} stroke="#1e1e1e" strokeWidth={1}/>
    </svg>
  );
}

function PCRSparkline({history,color}) {
  if(history.length<2) return (
    <div style={{height:50,display:"flex",alignItems:"center",justifyContent:"center",color:"#333",fontSize:11}}>
      Collecting PCR data…
    </div>
  );
  const W=340, H=50, PAD=4;
  const vals = history.map(h=>h.pcr);
  const minV = Math.min(...vals,0.8);
  const maxV = Math.max(...vals,1.2);
  const range = maxV-minV||0.1;
  const px = (i) => PAD + (i/(vals.length-1))*(W-PAD*2);
  const py = (v) => H-PAD - ((v-minV)/range)*(H-PAD*2);
  const pts = vals.map((v,i)=>`${px(i)},${py(v)}`).join(" ");
  const areaPath = `M${px(0)},${H-PAD} ` + vals.map((v,i)=>`L${px(i)},${py(v)}`).join(" ") + ` L${px(vals.length-1)},${H-PAD} Z`;
  const refY = py(1.0);
  return (
    <svg viewBox={`0 0 ${W} ${H}`} style={{width:"100%"}}>
      <defs>
        <linearGradient id={"pcr"+color.replace("#","")} x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor={color} stopOpacity="0.25"/>
          <stop offset="100%" stopColor={color} stopOpacity="0"/>
        </linearGradient>
      </defs>
      <path d={areaPath} fill={`url(#pcr${color.replace("#","")})`}/>
      <polyline points={pts} fill="none" stroke={color} strokeWidth="1.5"/>
      <line x1={PAD} y1={refY} x2={W-PAD} y2={refY} stroke="#333" strokeWidth="1" strokeDasharray="2,2"/>
      <text x={W-PAD-2} y={refY-3} textAnchor="end" fill="#444" fontSize="8" fontFamily="monospace">1.0</text>
    </svg>
  );
}

// ══════════════════════════════════════════════════════
// SMALL COMPONENTS
// ══════════════════════════════════════════════════════
function Dot({on,color}) {
  return (
    <span style={{
      display:"inline-block",width:8,height:8,borderRadius:"50%",flexShrink:0,
      background: on?color:"#2a2a2a",
      boxShadow:  on?`0 0 7px ${color}`:"none",
      animation:  on?"blink 1.2s infinite":"none",
    }}/>
  );
}

function SignalRow({s}) {
  const on  = s.bull||s.bear;
  const dir = s.bull?"BULL":s.bear?"BEAR":"WAIT";
  const dc  = s.bull?"#00d4aa":s.bear?"#f87171":"#2a2a2a";
  return (
    <div style={{display:"flex",alignItems:"center",gap:10,padding:"7px 10px",
      borderRadius:6,marginBottom:4,
      background:on?"rgba(255,255,255,0.025)":"transparent",
      borderLeft:`2px solid ${on?dc:"#1e1e1e"}`}}>
      <Dot on={on} color={dc}/>
      <div style={{flex:1,minWidth:0}}>
        <div style={{fontSize:9,color:"#555"}}>{s.id} {s.note && <span style={{color:"#3a3a3a"}}>— {s.note}</span>}</div>
        <div style={{fontSize:12,color:on?"#ddd":"#555",fontWeight:500}}>{s.label}</div>
      </div>
      <div style={{textAlign:"right",flexShrink:0}}>
        <div style={{fontSize:11,color:dc,fontWeight:700}}>{dir}</div>
        <div style={{fontSize:10,color:"#555"}}>{s.val}</div>
      </div>
    </div>
  );
}

// ══════════════════════════════════════════════════════
// IST CLOCK
// ══════════════════════════════════════════════════════
function ISTClock({wsOk}) {
  const [t,   setT]   = useState(istTimeStr());
  const [d,   setD]   = useState(istDateStr());
  const [ses, setSes] = useState(getSession());
  const [bw,  setBw]  = useState(isBlastWin());
  useEffect(()=>{
    const id=setInterval(()=>{
      setT(istTimeStr());setD(istDateStr());setSes(getSession());setBw(isBlastWin());
    },1000);
    return ()=>clearInterval(id);
  },[]);
  return (
    <div style={{display:"flex",alignItems:"center",gap:8,fontFamily:"monospace"}}>
      <div>
        <div style={{fontSize:15,fontWeight:700,color:"#fff",letterSpacing:2,fontVariantNumeric:"tabular-nums"}}>
          {t} <span style={{fontSize:9,color:"#444"}}>IST</span>
        </div>
        <div className="hide-mobile" style={{fontSize:9,color:"#444"}}>{d}</div>
      </div>
      <div style={{padding:"3px 8px",borderRadius:5,border:`1px solid ${ses.color}44`,
        background:ses.color+"11",textAlign:"center"}}>
        <div style={{fontSize:8,color:ses.color+"88",letterSpacing:1}}>SESSION</div>
        <div style={{fontSize:10,fontWeight:700,color:ses.color}}>{ses.label}</div>
      </div>
      {bw && (
        <div style={{padding:"3px 8px",borderRadius:5,border:"1px solid #f59e0b44",
          background:"#f59e0b0d",textAlign:"center",animation:"blink 1.5s infinite"}}>
          <div style={{fontSize:8,color:"#f59e0b88"}}>WINDOW</div>
          <div style={{fontSize:10,fontWeight:700,color:"#f59e0b"}}>⚡ BLAST</div>
        </div>
      )}
      <div style={{padding:"3px 8px",borderRadius:5,
        border:`1px solid ${wsOk?"#00d4aa33":"#f8717133"}`,
        background:wsOk?"#00d4aa0d":"#f871710d"}}>
        <div style={{fontSize:8,color:wsOk?"#00d4aa88":"#f8717188"}}>FEED</div>
        <div style={{fontSize:10,fontWeight:700,color:wsOk?"#00d4aa":"#f87171"}}>
          {wsOk?"● LIVE":"○ OFF"}
        </div>
      </div>
    </div>
  );
}

// ══════════════════════════════════════════════════════
// TOKEN UPDATER
// ══════════════════════════════════════════════════════
function TokenUpdater({url}) {
  const [tok,setTok]   = useState("");
  const [msg,setMsg]   = useState("");
  const update = async () => {
    if(tok.length<20){setMsg("❌ Token too short");return;}
    try{
      const r=await fetch(url+"/api/token/update",{
        method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({token:tok})
      });
      const d=await r.json();
      setMsg(d.status==="applying"?"✅ Applying — reconnecting…":"❌ "+(d.msg||"Error"));
      if(d.status==="applying") setTok("");
    }catch(e){setMsg("❌ "+e.message);}
  };
  return (
    <div>
      <div style={{fontSize:9,color:"#555",marginBottom:4,letterSpacing:1}}>REFRESH DHAN TOKEN</div>
      <div style={{display:"flex",gap:6}}>
        <input value={tok} onChange={e=>setTok(e.target.value)} type="password"
          placeholder="Paste new Dhan access token"
          style={{padding:"6px 10px",borderRadius:5,border:"1px solid #2a2a2a",
            background:"#111",color:"#fff",fontSize:11,fontFamily:"monospace",width:240}}/>
        <button onClick={update} style={{padding:"6px 12px",borderRadius:5,border:"none",
          background:"#f59e0b",color:"#000",fontSize:11,fontWeight:700,cursor:"pointer",fontFamily:"monospace"}}>
          UPDATE
        </button>
      </div>
      {msg && <div style={{fontSize:10,marginTop:4,color:msg.startsWith("✅")?"#00d4aa":"#f87171"}}>{msg}</div>}
    </div>
  );
}

// ══════════════════════════════════════════════════════
// INDEX PANEL
// ══════════════════════════════════════════════════════
function IndexPanel({cfg,spot,backendOk,url,addAlert}) {
  const {code,color,fallback,step,exp} = cfg;
  const [tab,  setTab]  = useState("signals");
  const [hist, setHist] = useState([{pcr:1.0,t:"09:15"}]);

  const cur      = spot>0?spot:fallback;
  const onExpiry = isExpiryDay(code);
  const {chain,pcr,prevChain,prevPcr,vwap} = useChain(url,code,backendOk);

  const prevPcrRef = useRef(pcr);
  useEffect(()=>{
    if(pcr!==prevPcrRef.current){
      setHist(h=>[...h.slice(-40),{pcr,t:istHHMM()}]);
      prevPcrRef.current=pcr;
    }
  },[pcr]);

  const openRef = useRef(0);
  useEffect(()=>{if(cur>0&&!openRef.current) openRef.current=cur;},[cur]);
  const open   = openRef.current||cur;
  const chg    = cur-open;
  const chgPct = open>0?(chg/open)*100:0;
  const effVwap = vwap>0?vwap:cur*0.9992;

  const sig = computeSignals(chain,pcr,prevPcr,cur,step,effVwap,onExpiry,prevChain);
  const cc  = sig.confidence>=3?(sig.dir==="BULL"?"#00d4aa":"#f87171"):
              sig.confidence===2?"#f59e0b":"#555";

  const lastRef = useRef("");
  useEffect(()=>{
    if(sig.confidence>=3 && sig.dir!=="NEUTRAL"){
      const key=`${code}-${sig.blastStrike}-${sig.dir}-${istHHMM().slice(0,4)}`;
      if(key!==lastRef.current){
        lastRef.current=key;
        addAlert({index:code,dir:sig.dir,strike:sig.blastStrike,side:sig.blastSide,
          spot:cur,score:sig.confidence,
          signals:sig.signals.filter(s=>s.bull||s.bear).map(s=>s.id).join(", "),
          time:istHHMM(),onExpiry});
      }
    }
  },[sig.dir,sig.blastStrike,sig.confidence]);

  return (
    <div style={{background:"#0d0d0d",border:"1px solid #1e1e1e",borderRadius:12,overflow:"hidden"}}>

// ORB STATE HOOK — polls /api/state every 2s
// ══════════════════════════════════════════════════════
function useORBState(url, backendOk) {
  const [orb, setOrb] = useState(null);
  useEffect(()=>{
    if(!url||!backendOk){setOrb(null);return;}
    let dead=false;
    const poll=async()=>{
      try{
        const r=await fetch(url+"/api/state",{cache:"no-store"});
        if(!r.ok) return;
        const d=await r.json();
        if(!dead) setOrb(d);
      }catch(e){}
    };
    poll();
    const id=setInterval(poll,2000);
    return()=>{dead=true;clearInterval(id);};
  },[url,backendOk]);
  return orb;
}

// POSITION CARD
// ══════════════════════════════════════════════════════
function PositionCard({pos,entry,sl,target,trailHigh}) {
  if(!pos) return (
    <div style={{background:"#0a0a0a",border:"1px solid #1a1a1a",borderRadius:9,
      padding:"14px",display:"flex",alignItems:"center",justifyContent:"center",
      color:"#2a2a2a",fontSize:11,fontFamily:"monospace",minHeight:90}}>
      No active position
    </div>
  );
  const cur  = trailHigh||entry;
  const pnl  = ((cur-entry)*pos.qty).toFixed(0);
  const pnlPct = entry>0?((cur-entry)/entry*100).toFixed(2):0;
  const isWin = cur>=entry;
  const pc = isWin?"#00d4aa":"#f87171";
  const slPct = entry>0?((sl-entry)/entry*100).toFixed(1):0;
  const tgtPct = entry>0?((target-entry)/entry*100).toFixed(1):0;
  // progress bar: 0=sl, 1=target
  const range = target-sl;
  const progress = range>0?Math.min(1,Math.max(0,(cur-sl)/range))*100:50;

  return (
    <div style={{background:"#0a0a0a",border:`1px solid ${pc}33`,borderRadius:9,padding:"12px 14px"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
        <div>
          <span style={{fontSize:9,color:"#555",letterSpacing:1}}>POSITION</span>
          <div style={{fontSize:14,fontWeight:700,color:"#fff",marginTop:1}}>
            {pos.symbol}
          </div>
        </div>
        <div style={{textAlign:"right"}}>
          <div style={{fontSize:9,color:"#555"}}>UNREALISED P&L</div>
          <div style={{fontSize:18,fontWeight:700,color:pc}}>
            {isWin?"+":""}{Number(pnl).toLocaleString("en-IN")} <span style={{fontSize:11}}>({pnlPct}%)</span>
          </div>
        </div>
      </div>
      {/* SL → Current → Target bar */}
      <div style={{marginBottom:8}}>
        <div style={{display:"flex",justifyContent:"space-between",fontSize:9,color:"#555",marginBottom:3}}>
          <span>SL ₹{sl} ({slPct}%)</span>
          <span>Entry ₹{entry}</span>
          <span>Tgt ₹{target} (+{tgtPct}%)</span>
        </div>
        <div style={{height:4,background:"#1e1e1e",borderRadius:2,overflow:"hidden"}}>
          <div style={{width:`${progress}%`,height:"100%",background:pc,borderRadius:2,transition:"width 0.5s"}}/>
        </div>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr 1fr",gap:6}}>
        {[
          {l:"TYPE",v:pos.type,c:pos.type==="CE"?"#f87171":"#34d399"},
          {l:"STRIKE",v:Number(pos.strike).toLocaleString("en-IN"),c:"#fff"},
          {l:"QTY",v:pos.qty,c:"#aaa"},
          {l:"MODE",v:(pos.order_id||"").startsWith("PAPER")?"PAPER":"LIVE",
           c:(pos.order_id||"").startsWith("PAPER")?"#f59e0b":"#00d4aa"},
        ].map(i=>(
          <div key={i.l} style={{background:"#111",borderRadius:5,padding:"5px 7px",textAlign:"center",border:"1px solid #1e1e1e"}}>
            <div style={{fontSize:8,color:"#444"}}>{i.l}</div>
            <div style={{fontSize:11,fontWeight:700,color:i.c,marginTop:1}}>{i.v}</div>
          </div>
        ))}
      </div>
      {pos.entry_time && <div style={{fontSize:9,color:"#444",marginTop:6,textAlign:"right"}}>Entry: {pos.entry_time} IST</div>}
    </div>
  );
}

  );

  return (
    <div style={{background:"#0d0d0d",border:"1px solid #1e1e1e",borderRadius:12,overflow:"hidden",marginTop:14,fontFamily:"monospace"}}>

      {/* ORB HEADER */}
      <div style={{background:"#111",borderBottom:"1px solid #1e1e1e",padding:"11px 14px",
        display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:8}}>
        <div style={{display:"flex",alignItems:"center",gap:10}}>
          <div style={{width:3,height:34,borderRadius:2,background:"#60a5fa",flexShrink:0}}/>
          <div>
            <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:2}}>
              <span style={{fontSize:10,color:"#555",letterSpacing:2}}>ORB + VWAP ENGINE</span>
              <span style={{fontSize:8,padding:"1px 6px",borderRadius:3,fontWeight:700,
                background:stratOn?"#00d4aa22":"#f8717122",
                color:stratOn?"#00d4aa":"#f87171",
                border:`1px solid ${stratOn?"#00d4aa44":"#f8717144"}`}}>
                {stratOn?"● RUNNING":"○ STOPPED"}
              </span>
              <span style={{fontSize:8,padding:"1px 5px",borderRadius:3,
                background:mode==="paper"?"#f59e0b22":"#00d4aa22",
                color:mode==="paper"?"#f59e0b":"#00d4aa",
                border:`1px solid ${mode==="paper"?"#f59e0b44":"#00d4aa44"}`}}>
                {mode.toUpperCase()}
              </span>
              {!backendOk && <span style={{fontSize:8,padding:"1px 5px",borderRadius:3,
                background:"#f8717122",color:"#f87171",border:"1px solid #f8717144"}}>OFFLINE</span>}
            </div>
            <div style={{fontSize:12,fontWeight:700,color:"#fff"}}>
              NiftyEdge Pro v2 &nbsp;
              <span style={{fontSize:10,color:"#555"}}>Client: {orb?.config?.client_id||"—"}</span>
            </div>
          </div>
        </div>

        {/* P&L + Controls */}
        <div style={{display:"flex",alignItems:"center",gap:10,flexWrap:"wrap"}}>
          <div style={{textAlign:"right"}}>
            <div style={{fontSize:9,color:"#555"}}>TODAY P&L</div>
            <div style={{fontSize:18,fontWeight:700,color:pnlColor,fontVariantNumeric:"tabular-nums"}}>
              {pnl>=0?"+":""}{Number(pnl).toLocaleString("en-IN",{maximumFractionDigits:0})}
            </div>
          </div>
          {pos && (
            <button onClick={squareOff} style={{padding:"6px 12px",borderRadius:6,border:"1px solid #f8717144",
              background:"#f8717111",color:"#f87171",fontSize:10,fontWeight:700,
              cursor:"pointer",fontFamily:"monospace"}}>
              ⏹ SQUARE OFF
            </button>
          )}
          <button
            onClick={()=>toggleStrategy(!stratOn)}
            disabled={toggling||!backendOk}
            style={{padding:"7px 16px",borderRadius:7,border:"none",
              background:stratOn?"#f87171":backendOk?"#00d4aa":"#333",
              color:"#000",fontSize:11,fontWeight:700,
              cursor:backendOk?"pointer":"not-allowed",fontFamily:"monospace",
              opacity:toggling?0.6:1}}>
            {toggling?"...":(stratOn?"⏹ STOP":"▶ START")}
          </button>
        </div>
      </div>

      {/* FILTERS BAR */}
      <div style={{padding:"8px 14px",background:"#0a0a0a",borderBottom:"1px solid #1a1a1a"}}>
        <div className="orb-filters">
          <FilterBadge label="GAP"   pass={backendOk?filters.gap:null}   value={filters.gap_pct!=null?filters.gap_pct.toFixed(2)+"%":undefined}/>
          <FilterBadge label="VIX"   pass={backendOk?filters.vix:null}   value={orb?.vix>0?orb.vix.toFixed(1):undefined}/>
          <FilterBadge label="TIME"  pass={backendOk?filters.time:null}  />
          <FilterBadge label="LIMIT" pass={backendOk?filters.limit:null} />
          <FilterBadge label="EMA15" pass={null} value={ema>0?Number(ema).toLocaleString("en-IN"):undefined}/>
          {orHigh && <div style={{padding:"4px 10px",borderRadius:5,border:"1px solid #f59e0b33",background:"#f59e0b0d",textAlign:"center"}}>
            <div style={{fontSize:8,color:"#f59e0b88"}}>OR HIGH</div>
            <div style={{fontSize:10,fontWeight:700,color:"#f59e0b"}}>{Number(orHigh).toLocaleString("en-IN")}</div>
          </div>}
          {orLow && <div style={{padding:"4px 10px",borderRadius:5,border:"1px solid #a78bfa33",background:"#a78bfa0d",textAlign:"center"}}>
            <div style={{fontSize:8,color:"#a78bfa88"}}>OR LOW</div>
            <div style={{fontSize:10,fontWeight:700,color:"#a78bfa"}}>{Number(orLow).toLocaleString("en-IN")}</div>
          </div>}
          {sweep && <div style={{padding:"4px 10px",borderRadius:5,border:"1px solid #f8717133",background:"#f8717111",textAlign:"center",animation:"blink 1.2s infinite"}}>
            <div style={{fontSize:8,color:"#f8717188"}}>SWEEP</div>
            <div style={{fontSize:10,fontWeight:700,color:"#f87171"}}>{sweep.replace("SWEEP_","")}</div>
          </div>}
        </div>
      </div>

      {/* TABS */}
      <div style={{display:"flex",borderBottom:"1px solid #1a1a1a",background:"#0d0d0d"}}>
        {["overview","trades","alerts"].map(t=>(
          <button key={t} onClick={()=>setTab(t)} style={{flex:1,padding:"8px 0",
            background:tab===t?"#141414":"transparent",border:"none",
            borderBottom:tab===t?"2px solid #60a5fa":"2px solid transparent",
            color:tab===t?"#ddd":"#444",fontSize:10,letterSpacing:1.5,
            cursor:"pointer",fontFamily:"monospace",textTransform:"uppercase"}}>
            {t}{t==="trades"&&trades.length>0?` (${trades.length})`:""}
            {t==="alerts"&&alerts.length>0?` (${alerts.length})`:""}
          </button>
        ))}
      </div>

      {/* TAB CONTENT */}
      <div style={{padding:12}}>

        {tab==="overview" && (
          <div>
            {/* P&L Stats row */}
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr 1fr",gap:8,marginBottom:12}}>
              {[
                {l:"GROSS WIN",  v:"₹"+Number(grossWin).toLocaleString("en-IN",{maximumFractionDigits:0}),  c:"#00d4aa"},
                {l:"GROSS LOSS", v:"₹"+Number(grossLoss).toLocaleString("en-IN",{maximumFractionDigits:0}),  c:"#f87171"},
                {l:"SIGNALS",    v:orb?.signals_count||0, c:"#60a5fa"},
                {l:"BLOCKED",    v:orb?.blocked_count||0, c:"#f59e0b"},
              ].map(i=>(
                <div key={i.l} style={{background:"#111",borderRadius:7,padding:"8px 10px",border:"1px solid #1e1e1e",textAlign:"center"}}>
                  <div style={{fontSize:9,color:"#444"}}>{i.l}</div>
                  <div style={{fontSize:14,fontWeight:700,color:i.c,marginTop:2}}>{i.v}</div>
                </div>
              ))}
            </div>
            {/* Position card */}
            <div style={{marginBottom:12}}>
              <div style={{fontSize:9,color:"#444",letterSpacing:1,marginBottom:6}}>◆ ACTIVE POSITION</div>
              <PositionCard pos={pos} entry={orb?.entry_price||0}
                sl={orb?.sl_price||0} target={orb?.target_price||0}
                trailHigh={orb?.trail_high||0}/>
            </div>
            {/* OR + Sweep info */}
            {(orHigh||orLow||sweep) && (
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8}}>
                {[
                  {l:"OR HIGH",v:orHigh?Number(orHigh).toLocaleString("en-IN"):"—",c:"#f59e0b"},
                  {l:"OR LOW", v:orLow ?Number(orLow).toLocaleString("en-IN") :"—",c:"#a78bfa"},
                  {l:"SWEEP",  v:sweep?sweep.replace("SWEEP_",""):"NONE",
                   c:sweep?"#f87171":"#333"},
                ].map(i=>(
                  <div key={i.l} style={{background:"#111",borderRadius:7,padding:"8px 10px",border:"1px solid #1e1e1e",textAlign:"center"}}>
                    <div style={{fontSize:9,color:"#444"}}>{i.l}</div>
                    <div style={{fontSize:14,fontWeight:700,color:i.c,marginTop:2}}>{i.v}</div>
                  </div>
                ))}
              </div>
            )}
            {!backendOk && (
              <div style={{color:"#333",fontSize:11,textAlign:"center",padding:"12px 0"}}>
                Connect backend to see ORB strategy data
              </div>
            )}
          </div>
        )}

        {tab==="trades" && (
          <div>
            <div style={{fontSize:9,color:"#444",letterSpacing:1,marginBottom:8}}>
              ◆ TODAY'S TRADES — {mode.toUpperCase()} MODE
            </div>
            <TradesTable trades={trades}/>
          </div>
        )}

        {tab==="alerts" && (
          <div style={{maxHeight:280,overflowY:"auto"}}>
            <div style={{fontSize:9,color:"#444",letterSpacing:1,marginBottom:8}}>
              ◆ STRATEGY ALERTS (latest first)
            </div>
            {alerts.length===0
              ? <div style={{color:"#2a2a2a",fontSize:11,textAlign:"center",padding:"16px 0"}}>No alerts yet</div>
              : alerts.map((a,i)=>{
                  const lc=a.level==="success"?"#00d4aa":a.level==="danger"?"#f87171":
                           a.level==="warn"?"#f59e0b":a.level==="block"?"#a78bfa":"#555";
                  return (
                    <div key={i} style={{display:"flex",gap:8,padding:"5px 0",
                      borderBottom:"1px solid #0f0f0f",alignItems:"flex-start"}}>
                      <span style={{fontSize:9,color:"#444",minWidth:56,flexShrink:0}}>{a.time}</span>
                      <span style={{fontSize:9,fontWeight:700,color:lc,minWidth:46,flexShrink:0,textTransform:"uppercase"}}>{a.level}</span>
                      <span style={{fontSize:10,color:"#888"}}>{a.msg}</span>
                    </div>
                  );
                })}
          </div>
        )}
      </div>
    </div>
  );
}

function App() {
  // HTML is served by Flask itself → same origin is the backend
  const defaultUrl = window.location.origin;
  const [url,      setUrl]      = useState(()=>{ try{return localStorage.getItem("gbt_url")||defaultUrl;}catch{return defaultUrl;} });
  const [urlInput, setUrlInput] = useState(url);
  const [setup,    setSetup]    = useState(false);
  const [alerts,   setAlerts]   = useState([]);

  // Hide loader AFTER React first paint — not before
  useEffect(()=>{
    const el = document.getElementById("loader");
    if(el) el.style.display = "none";
  },[]);

  const {live,ok,err} = useBackend(url);
  const orb = useORBState(url, ok);

  const saveUrl = () => {
    const u = (urlInput||defaultUrl).replace(/\/$/,"").trim();
    setUrl(u);
    try{localStorage.setItem("gbt_url",u);}catch{}
    setSetup(false);
  };

  const addAlert = useCallback(a=>{
    setAlerts(prev=>{
      const key=`${a.index}-${a.strike}-${a.dir}`;
      if(prev.slice(0,4).some(p=>`${p.index}-${p.strike}-${p.dir}`===key)) return prev;
      return [a,...prev].slice(0,60);
    });
  },[]);

  const spots = {
    NIFTY:     live?.nifty     ||0,
    BANKNIFTY: live?.banknifty ||0,
    SENSEX:    live?.sensex    ||0,
  };

  return (
    <div style={{minHeight:"100vh",background:"#080808",paddingBottom:40}}>

      {/* TOP BAR */}
      <div style={{background:"#0a0a0a",borderBottom:"1px solid #1a1a1a",
        padding:"0 12px",display:"flex",alignItems:"center",justifyContent:"space-between",
        height:50,position:"sticky",top:0,zIndex:100,minHeight:50}}>
        <div style={{display:"flex",alignItems:"center",gap:11}}>
          <div style={{width:26,height:26,borderRadius:7,
            background:"linear-gradient(135deg,#00d4aa,#a78bfa)",
            display:"flex",alignItems:"center",justifyContent:"center",fontSize:13}}>⚡</div>
          <div>
            <div style={{fontFamily:"'Syne',sans-serif",fontWeight:800,fontSize:15,letterSpacing:1,color:"#fff"}}>
              GAMMA BLAST <span style={{color:"#60a5fa"}}>+ ORB</span>
            </div>
            <div className="hide-mobile" style={{fontSize:9,color:"#444",fontFamily:"monospace",letterSpacing:1}}>
              GAMMA BLAST · ORB+VWAP · NIFTY · BANKNIFTY · SENSEX
            </div>
          </div>
        </div>
        <div style={{display:"flex",alignItems:"center",gap:10}}>
          <ISTClock wsOk={!!(live&&live.ws_connected)}/>
          <button onClick={()=>setSetup(v=>!v)} style={{padding:"4px 10px",borderRadius:5,
            border:"1px solid #2a2a2a",background:"transparent",cursor:"pointer",
            color:ok?"#555":"#f87171",fontSize:10,fontFamily:"monospace"}}>
            {ok?"⚙ SETUP":"⚙ CONNECT"}
          </button>
        </div>
      </div>

      {/* SETUP PANEL */}
      {setup && (
        <div className="setup-row" style={{background:"#0d0d0d",borderBottom:"1px solid #1a1a1a",
          padding:"12px 18px",display:"flex",gap:14,alignItems:"flex-end",flexWrap:"wrap"}}>
          <div>
            <div style={{fontSize:9,color:"#555",marginBottom:4,fontFamily:"monospace",letterSpacing:1}}>
              BACKEND URL (this server by default)
            </div>
            <div style={{display:"flex",gap:6}}>
              <input value={urlInput} onChange={e=>setUrlInput(e.target.value)}
                placeholder={defaultUrl}
                className="setup-input" style={{padding:"6px 10px",borderRadius:5,border:"1px solid #2a2a2a",
                  background:"#111",color:"#fff",fontSize:11,fontFamily:"monospace",width:280}}/>
              <button onClick={saveUrl} style={{padding:"6px 14px",borderRadius:5,border:"none",
                background:"#00d4aa",color:"#000",fontSize:11,fontWeight:700,
                cursor:"pointer",fontFamily:"monospace"}}>CONNECT</button>
            </div>
          </div>
          <div style={{padding:"7px 12px",borderRadius:7,background:"#111",
            border:"1px solid #1e1e1e",fontSize:10,fontFamily:"monospace",maxWidth:380}}>
            {ok
              ? <span style={{color:"#00d4aa"}}>
                  ✅ Connected · WS {live.ws_connected?"● LIVE":"○ OFF"}
                  {live.vix>0?` · VIX ${live.vix.toFixed(1)}`:""}
                  {live.last_tick?` · Tick ${live.last_tick} IST`:""}
                </span>
              : <span style={{color:"#f87171"}}>❌ {err||"Cannot reach backend"}</span>
            }
          </div>
          {ok && <TokenUpdater url={url}/>}
        </div>
      )}

      {/* 3 INDEX PANELS */}
      <div className="grid-indices">
        {Object.values(INDICES).map(cfg=>(
          <IndexPanel key={cfg.code} cfg={cfg} spot={spots[cfg.code]}
            backendOk={ok} url={url} addAlert={addAlert}/>
        ))}
      </div>

      {/* ALERTS */}
      <div style={{padding:"0 10px 14px"}}>
        <AlertsPanel alerts={alerts} onClear={()=>setAlerts([])}/>
      </div>

      {/* ── DIVIDER ── */}
      <div style={{margin:"4px 10px 0",borderTop:"1px solid #1a1a1a",paddingTop:4}}>
        <div style={{fontSize:9,color:"#2a2a2a",fontFamily:"monospace",letterSpacing:2,padding:"4px 4px"}}>
          ◆◆ ORB + VWAP STRATEGY ENGINE
        </div>
      </div>

      {/* ORB STRATEGY PANEL */}
      <div style={{padding:"0 10px"}}>
        <ORBPanel orb={orb} url={url} backendOk={ok}/>
      </div>

      {/* REFERENCE GUIDE */}
      <div style={{margin:"14px 0 0"}} className="grid-ref">
        {[
          {icon:"📅",title:"EXPIRY SCHEDULE",
            lines:["Nifty 50 → Every Tuesday","Bank Nifty → Every Wednesday","Sensex → Every Friday","Monthly = last week's expiry"]},
          {icon:"📊",title:"S1: DECAY PAUSE",
            lines:["Expiry day only — theta burns fast","CE stops decaying → bullish loading","PE stops decaying → bearish loading","Ignore on non-expiry days"]},
          {icon:"⚖️",title:"S2 + S3: PCR & OI",
            lines:["PCR drop >0.12 in 10min → bullish","PCR rise >0.12 in 10min → bearish","CE OI +15% fast → resistance build","PE OI -15% fast → floor collapsing"]},
          {icon:"💧",title:"S4: VWAP + WINDOWS",
            lines:["Above VWAP → bulls in control","Below VWAP → bears in control","Window 1: 09:20–10:30 IST","Window 2: 14:00–15:15 IST"]},
        ].map(g=>(
          <div key={g.title} style={{background:"#0d0d0d",border:"1px solid #1a1a1a",borderRadius:9,padding:"10px 12px"}}>
            <div style={{fontSize:14,marginBottom:4}}>{g.icon}</div>
            <div style={{fontSize:9,color:"#555",fontFamily:"monospace",fontWeight:700,letterSpacing:0.5,marginBottom:5}}>{g.title}</div>
            {g.lines.map(l=><div key={l} style={{fontSize:10,color:"#444",marginBottom:2}}>· {l}</div>)}
          </div>
        ))}
      </div>

      <div style={{textAlign:"center",fontSize:9,color:"#1e1e1e",fontFamily:"monospace",padding:"0 0 8px"}}>
        GAMMA BLAST TERMINAL + ORB ENGINE v2.0 · LIVE DHAN FEED · PAPER TRADING & EDUCATION · NOT SEBI REGISTERED
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
